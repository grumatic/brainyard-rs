[workspace]
resolver = "2"
members = [
  "crates/by-cli",
  "crates/by-contracts",
  "crates/by-llm",
  "crates/by-config",
  "crates/by-memory",
  "crates/by-persist",
  "crates/by-registry",
  "crates/by-tui",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
predicates = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

aws-config = { version = "1", features = ["behavior-version-latest", "credentials-login"] }
aws-sdk-bedrockruntime = "1"
aws-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

by-contracts = { path = "crates/by-contracts" }
by-config = { path = "crates/by-config" }
by-llm = { path = "crates/by-llm" }
by-memory = { path = "crates/by-memory" }
by-persist = { path = "crates/by-persist" }
by-registry = { path = "crates/by-registry" }
by-tui = { path = "crates/by-tui" }
